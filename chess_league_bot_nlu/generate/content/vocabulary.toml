# Values that fill command arguments.
#
# A username is one of `username_forms` filled with words from
# `username_words`: {w} a word, {W} the same capitalized, {w2}/{W2} a second
# word, {n} a number. With `mention_chance` it is written as a chat mention,
# @**name**. In `rounds` and `subscription_ids`, {n} is a number from 1 to 12;
# in `rounds` {m} is a later one, {word} the number written out and {ordinal}
# like "3rd".

username_words = [
  "knight", "rook", "pawn", "queen", "bishop", "tal", "fischer", "gambit", "sicilian", "caro",
  "endgame", "zugzwang", "blitz", "tempo", "fork", "pin", "castle", "dragon", "najdorf", "morphy",
]
username_forms = ["{w}{n}", "{W}_{w2}", "{w}_{w2}{n}", "{W}{W2}", "the_{w}", "{w}lover{n}"]
mention_chance = 0.25

# A team name is one of `team_forms` filled with words from `team_words`: {a}
# a word, {b} another, {n} a number.
