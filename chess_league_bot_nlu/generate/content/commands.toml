# How the generator plans messages to the bot. Intents themselves (their labels
# and descriptions) are in chess_league_bot_nlu/intents.toml.
#
# Arguments: each is included with probability `chance`; `values` names a list
# in vocabulary.toml, or "players" for a generated username.

none_share = 0.3   # share of messages that are not commands

# What a `none` message is, one picked per message.
none_kinds = [
  "thanks the bot or says something friendly to it",
  "a greeting or small talk",
  "complains about a loss or a tough round",
  "asks a chess question the bot can't answer (openings, tactics, engines)",
  "asks for something the bot can't do (swap boards, change a result, predict a winner)",
  "asks about another person in a way that isn't a command (has someone been online?)",
  "a near miss that sounds like a command but isn't (tell someone I said hi, tell me a joke)",
  "says something about their own availability that isn't setting it (I'm available to help test the bot)",
  "a test message or keyboard mash",
  "a question about league policy the bot doesn't handle (are draws by agreement allowed?)",
  "talks about the bot in the third person to someone else (the bot is great, the bot was down earlier)",
  "reacts to an earlier answer from the bot (ha, nice, that's wrong)",
  "tells the bot about their game result or how they played, without asking for anything",
  "asks the bot an opinion question (who will win the season, is the London boring)",
  "jokes around with the bot, pretending it's a person",
  "mentions a command word in passing without asking for it (my rating has been terrible lately)",
  "scheduling chatter meant for their opponent, sent to the bot by mistake",
]

# Commands only moderators or captains send; never phrased in these styles.
moderator_intents = ["response_add", "response_remove", "assign_alternate", "unassign_alternate"]
not_for_moderators = ["indirect", "newcomer", "frustrated", "emoji"]

# What the writer is told about each event of a notification request.
event_descriptions = { starts = "when the game starts", ends = "when the game ends or its result", scheduled = "when the game gets scheduled" }

# One line of the writer's plan per message. Slots: {what}, {event}, {include},
# {angle}, {style}, {words}.
line = "{what}{event}{angle}{include}. Style: {style}. At most {words} words."
none_what = "{kind} (not a request the bot can act on)"
event = "; they want to hear {description}"
include = "; include {placeholders}"
no_placeholders = "; no placeholders"
angle = "; {angle}"     # one of the intent's `angles`, added with `angle_chance`
angle_chance = 0.7

# Phrasing styles: how often each is used, what the writer is told, and the
# word limits a message in that style is given.
[styles]
near_exact = { weight = 3, words = [4, 6, 8], description = "close to a terse command, like 'rating bob' or 'pairings', but not necessarily exact syntax" }
question = { weight = 4, words = [6, 8, 12, 15], description = "a natural question" }
indirect = { weight = 3, words = [8, 12, 15, 20], description = "describes a need or a problem rather than asking directly" }
terse = { weight = 2, words = [3, 4, 6], description = "very short, a few words" }
polite = { weight = 2, words = [8, 12, 15], description = "polite but still short" }
typos = { weight = 2, words = [4, 6, 8, 12], description = "sloppy phone typing with typos and missing punctuation" }
runon = { weight = 1, words = [25, 35], description = "one long run-on sentence with extra context" }
frustrated = { weight = 1, words = [6, 8, 12], description = "a bit frustrated or impatient" }
newcomer = { weight = 1, words = [8, 12, 15], description = "a confused new player who doesn't know the right words" }
keyword = { weight = 3, words = [1, 2, 3, 4], description = "just the command word and its arguments, the way a regular types it, maybe misspelled" }
fragment = { weight = 2, words = [3, 5, 7], description = "a fragment with no verb, like a search query" }
aside = { weight = 2, words = [8, 12, 16], description = "mid-conversation, starting with something like 'also', 'oh and', 'btw' or 'quick one'" }
emoji = { weight = 1, words = [4, 6, 10], description = "casual, with an emoji or two" }
multi = { weight = 1, words = [15, 25], description = "two sentences: a bit of context first, then the request" }

# Arguments per intent. Intents not listed take no arguments.
[arguments]
tell = [
  { label = "player", chance = 0.45, values = "players" },
  { label = "league", chance = 0.2, values = "leagues" },
  { label = "team", chance = 0.15, values = "teams" },
  { label = "recipient", chance = 0.15, values = "players" },
]
subscription_remove = [
  { label = "subscription id", chance = 0.6, values = "subscription_ids" },
  { label = "player", chance = 0.2, values = "players" },
  { label = "league", chance = 0.2, values = "leagues" },
]
subscribe_teams = [{ label = "team", chance = 0.4, values = "teams" }]
response_add = [{ label = "phrase", chance = 1.0, values = "phrases" }]
response_remove = [{ label = "phrase", chance = 1.0, values = "phrases" }]
rating = [{ label = "player", chance = 0.7, values = "players" }]
pairing = [
  { label = "player", chance = 0.5, values = "players" },
  { label = "round", chance = 0.3, values = "rounds" },
]
pairings_link = [{ label = "league", chance = 0.3, values = "leagues" }]
standings_link = [{ label = "league", chance = 0.3, values = "leagues" }]
rules = [{ label = "league", chance = 0.3, values = "leagues" }]
faq = [{ label = "league", chance = 0.3, values = "leagues" }]
starter_guide = [{ label = "league", chance = 0.3, values = "leagues" }]
captain_guidelines = [{ label = "league", chance = 0.3, values = "leagues" }]
captains = [{ label = "league", chance = 0.3, values = "leagues" }]
mods = [{ label = "league", chance = 0.3, values = "leagues" }]
nomination_url = [{ label = "league", chance = 0.3, values = "leagues" }]
notification_url = [{ label = "league", chance = 0.3, values = "leagues" }]
availability_url = [{ label = "league", chance = 0.3, values = "leagues" }]
available = [
  { label = "round", chance = 0.6, values = "rounds" },
  { label = "league", chance = 0.2, values = "leagues" },
]
unavailable = [
  { label = "round", chance = 0.6, values = "rounds" },
  { label = "league", chance = 0.2, values = "leagues" },
]
assign_alternate = [
  { label = "player", chance = 1.0, values = "players" },
  { label = "board", chance = 0.8, values = "boards" },
  { label = "round", chance = 0.5, values = "rounds" },
  { label = "team", chance = 0.3, values = "teams" },
]
unassign_alternate = [
  { label = "player", chance = 1.0, values = "players" },
  { label = "board", chance = 0.5, values = "boards" },
  { label = "round", chance = 0.5, values = "rounds" },
]
none = [
  { label = "player", chance = 0.15, values = "players" },
  { label = "league", chance = 0.15, values = "leagues" },
  { label = "round", chance = 0.1, values = "rounds" },
]

# Ways people put each request, one picked per message (with `angle_chance`)
# so the same intent is asked for in different words. Write them as what the
# person does, not as text to copy.
[angles]
help = ["asks what commands there are", "asks how to use the bot", "asks what the bot is for", "asks for the help text", "says they don't know what to type to the bot"]
tell = ["asks to be pinged when a game happens", "asks to follow a player's games", "asks to be alerted", "asks to get a message about it", "asks to keep them posted", "asks to watch a game for them", "asks for a heads up", "asks to subscribe to a player's games"]
subscription_list = ["asks what they're following", "asks which alerts they have set up", "asks to show their subscriptions", "asks what they've signed up for", "asks who they get pinged about"]
subscription_remove = ["asks to unsubscribe", "asks to stop the pings", "asks to unfollow", "asks to delete an alert", "asks to cancel a notification", "says they don't want those messages anymore"]
subscribe_teams = ["asks to follow their own team", "asks to be pinged for all their team's games", "asks to subscribe to their team", "asks to get team game alerts"]
response_add = ["tells the bot to answer whenever someone says the phrase", "asks to add an auto-reply", "asks to set up a canned response", "asks to make the bot react to a phrase"]
response_list = ["asks which phrases the bot reacts to", "asks for the list of canned responses", "asks what auto-replies exist", "asks to see the responses"]
response_remove = ["asks to delete an auto-reply", "asks to stop answering a phrase", "asks to drop a canned response", "says the bot should stop reacting to a phrase"]
rating = ["asks for elo", "asks how strong a player is", "asks for a rating", "asks what someone is rated", "asks for their own rating", "asks for a classical rating"]
pairing = ["asks who they're playing", "asks who their opponent is", "asks when someone's game is", "asks for their pairing", "asks who someone plays this round", "asks whether their game is scheduled"]
pairings_link = ["asks where the pairings are", "asks for the pairings page", "asks to see this round's pairings", "asks where to look up who plays whom"]
standings_link = ["asks for the table", "asks how the teams stand", "asks for the leaderboard", "asks who's leading", "asks for the scores so far"]
rules = ["asks for the rules", "asks for the regulations", "asks where the rules are written", "asks to see the league rules"]
faq = ["asks for the FAQ", "asks where common questions are answered", "asks for the frequently asked questions"]
starter_guide = ["asks for the starter guide", "asks what a new player should read", "asks for the handbook", "asks how to get started in the league"]
captain_guidelines = ["asks what a captain has to do", "asks for the captain guide", "asks about captain duties"]
captains = ["asks who the captains are", "asks who captains a team", "asks who their captain is"]
mods = ["asks who the mods are", "asks who runs the league", "asks for the list of moderators"]
summon_mods = ["asks for a mod to come help", "says they need a moderator", "pings the mods", "asks for an admin", "reports a problem and wants a mod"]
nomination_url = ["asks where to nominate a game", "asks for the game of the round nomination", "asks how to nominate a game"]
notification_url = ["asks where to change notification settings", "asks how to stop league emails or pings", "asks for the notification preferences page"]
availability_url = ["asks where to set availability", "asks how to mark rounds they can play", "asks for the availability page"]
link_accounts = ["asks to connect their lichess account", "asks how to verify their account", "asks to link accounts", "says the bot doesn't know their lichess name"]
available = ["says they can play", "says count them in", "says they're back and available", "marks themselves available"]
unavailable = ["says they can't play", "says they're away", "asks to be marked unavailable", "says to count them out", "says they need a break for a round"]
assign_alternate = ["puts an alternate in", "asks to sub a player in", "assigns a substitute", "asks to slot someone onto a board"]
unassign_alternate = ["removes an alternate", "undoes a substitution", "asks to take a sub off a board"]
source = ["asks where the code is", "asks for the bot's repo", "asks if the bot is open source", "asks for the github link"]
version = ["asks what version is running", "asks which build the bot is on", "asks if the bot was updated"]
uptime = ["asks how long the bot has been up", "asks when the bot last restarted", "asks if the bot has been running long"]
