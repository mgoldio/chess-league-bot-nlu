[project]
name = "chess-league-bot-nlu"
version = "0.1.0"
description = "Synthetic data, training and evaluation for a Lichess4545 league chat bot (arboters) language understanding"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = ["requests>=2.28"]

[dependency-groups]
# Training and evaluation. `uv sync --group train`.
train = [
    "anyascii==0.3.3",
    "torch==2.15.0",
    "transformers==5.22.1",
]
dev = ["pytest>=8", "ruff==0.17.4"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
